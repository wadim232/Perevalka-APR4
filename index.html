<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Допуски штрипса</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1216">
<style>
  :root {
    --bg:#eceef1; --surface:#fff; --surface-2:#f6f7f9; --border:#d3d8de; --border-strong:#b6bec7;
    --ink:#1b2027; --ink-2:#4a525c; --muted:#79828d; --accent:#c2410c; --accent-ink:#fff; --accent-soft:#fbe8de;
    --readout:#0f1216; --readout-ink:#f4f6f8; --good:#15803d; --good-soft:#e3f2e8; --warn:#b91c1c; --warn-soft:#fbe4e4;
    --radius:12px; --shadow:0 1px 2px rgba(20,28,38,.06),0 3px 10px rgba(20,28,38,.05);
  }
  :root:has(#themeToggle:checked){
    --bg:#14171b; --surface:#1c2027; --surface-2:#232830; --border:#333b45; --border-strong:#454f5b;
    --ink:#eef1f4; --ink-2:#b8c0ca; --muted:#838d99; --accent:#f4813f; --accent-ink:#1a1206; --accent-soft:#3a2416;
    --readout:#0a0c0f; --readout-ink:#f4f6f8; --good:#4ade80; --good-soft:#16281c; --warn:#f87171; --warn-soft:#33191a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 3px 12px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;font-size:16px}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
  .wrap{max-width:680px;margin:0 auto;padding:16px 14px 64px}
  header.top{display:flex;align-items:center;gap:12px;padding:4px 2px 14px}
  .logo{flex:0 0 auto;width:40px;height:40px;border-radius:9px;background:var(--readout);position:relative;overflow:hidden;box-shadow:var(--shadow)}
  .logo::before,.logo::after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--accent)}
  .logo::before{top:12px}.logo::after{top:25px;box-shadow:0 -6px 0 var(--readout-ink),0 6px 0 var(--readout-ink)}
  .title h1{margin:0;font-size:1.18rem;letter-spacing:.01em}
  .title p{margin:1px 0 0;color:var(--muted);font-size:.8rem}
  .theme-cb{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
  .theme-btn{margin-left:auto;flex:0 0 auto;border:1px solid var(--border);background:var(--surface);color:var(--ink-2);border-radius:9px;width:40px;height:40px;font-size:1.1rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;user-select:none}
  .theme-btn::after{content:"\263E"}
  :root:has(#themeToggle:checked) .theme-btn::after{content:"\2600"}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
  .card>.body{padding:14px}
  label.field{display:block;margin-bottom:10px}
  .field>.lab{display:block;font-size:.78rem;color:var(--ink-2);font-weight:600;margin-bottom:4px}
  select,input[type=number],input[type=text]{width:100%;padding:11px 12px;font-size:1rem;color:var(--ink);background:var(--surface);border:1px solid var(--border-strong);border-radius:9px;font-family:ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;appearance:none}
  select{-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%2379828d' stroke-width='2'/></svg>");background-repeat:no-repeat;background-position:right 12px center}
  input:focus,select:focus{outline:3px solid var(--accent-soft);outline-offset:1px;border-color:var(--accent)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .inline{display:flex;gap:6px}
  .inline select{flex:1}
  .icon-btn{flex:0 0 auto;width:46px;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--ink-2);border-radius:9px;font-size:1.05rem;cursor:pointer}
  .icon-btn:hover{border-color:var(--accent);color:var(--accent)}
  .row{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:11px 14px;border-top:1px solid var(--border)}
  .row .k{color:var(--ink-2);font-size:.9rem;flex:0 0 auto;max-width:46%}
  .row .v{font-weight:700;text-align:right}
  .row .v small{color:var(--muted);font-weight:500;font-size:.76rem;display:block;margin-top:3px;line-height:1.35}
  .v.warn{color:var(--warn)}.v.good{color:var(--good)}.v.muted{color:var(--muted);font-weight:500}
  .sect-hd{background:var(--readout);color:var(--readout-ink);padding:12px 14px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .sect-hd small{color:#9aa6b2;font-weight:500;font-size:.78rem}
  .sub-hd{padding:10px 14px 2px;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800;border-top:1px solid var(--border)}
  .notlist{padding:6px 14px 14px;margin:0}
  .notlist li{font-size:.86rem;color:var(--ink-2);margin:6px 0;list-style:none;padding-left:20px;position:relative}
  .notlist li::before{content:"\2717";position:absolute;left:0;top:1px;color:var(--warn);font-weight:700}
  .banner{padding:11px 14px;font-size:.9rem;font-weight:600;display:flex;gap:9px;align-items:flex-start}
  .banner.warn{background:var(--warn-soft);color:var(--warn)}
  .banner.note{background:var(--surface-2);color:var(--ink-2);font-weight:500;border-top:1px solid var(--border)}
  footer{text-align:center;color:var(--muted);font-size:.76rem;padding:8px 0}
  button.primary{font-family:inherit;font-size:.95rem;font-weight:700;cursor:pointer;border-radius:9px;padding:12px 14px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);width:100%}
  .term{background:var(--accent-soft);color:var(--accent);border-radius:5px;padding:1px 5px;cursor:pointer;font-weight:500;white-space:nowrap}
  .term:active{filter:brightness(.92)}
  .modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
  .modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.55)}
  .modal-panel{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);max-width:440px;width:100%;max-height:80vh;overflow:auto;padding:18px}
  .modal-x{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--ink-2);font-size:1rem;cursor:pointer}
  .modal-panel h3{margin:2px 40px 8px 0;font-size:1.1rem}
  .modal-panel p{margin:0;color:var(--ink-2);font-size:.95rem}
  .mrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 2px;border-top:1px solid var(--border)}
  .mrow:first-child{border-top:none}
  .mrow .mv{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:1.05rem}
  .mrow button{border:1px solid var(--warn);background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:6px 12px;font-size:.85rem;font-weight:600;cursor:pointer}
  details>summary{list-style:none;cursor:pointer}
  details>summary::-webkit-details-marker{display:none}
  .defref>summary{padding:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;background:var(--readout);color:var(--readout-ink);border-radius:var(--radius)}
  .defref[open]>summary{border-radius:var(--radius) var(--radius) 0 0}
  .defref>summary small{color:#9aa6b2;font-weight:500;font-size:.78rem}
  .defitem{border-top:1px solid var(--border)}
  .defitem>summary{padding:12px 14px;font-weight:600;font-size:.95rem;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .defitem>summary::after{content:"▾";color:var(--muted);flex:0 0 auto}
  .defitem[open]>summary::after{content:"▴"}
  .defbody{padding:0 14px 14px}
  .defbody p{margin:0 0 10px;color:var(--ink-2);font-size:.9rem}
  .defbody img{max-width:100%;border-radius:8px;border:1px solid var(--border);display:block}
  .nophoto{color:var(--muted);font-style:italic;font-size:.84rem;background:var(--surface-2);border:1px dashed var(--border-strong);border-radius:8px;padding:12px;text-align:center}
</style>

<div class="wrap">
  <header class="top">
    <div class="logo" aria-hidden="true"></div>
    <div class="title"><h1>Допуски штрипса</h1><p>Подкат и полосы после продольной резки</p></div>
    <input type="checkbox" id="themeToggle" class="theme-cb">
    <label class="theme-btn" for="themeToggle" title="Тема" role="button" aria-label="Тема"></label>
  </header>

  <div class="card"><div class="body">
    <label class="field"><span class="lab">Нормативный документ (НД)</span>
      <select id="ndSel"></select></label>
    <label class="field" id="ndCustomWrap" style="display:none"><span class="lab">Впиши свой НД</span>
      <input id="ndCustom" type="text" placeholder="напр. ТУ 14-1-XXXX"></label>

    <div class="grid2">
      <label class="field"><span class="lab">Тип проката</span>
        <select id="mat"><option value="gk">горячекатаный (г/к)</option><option value="xk">холоднокатаный (х/к)</option><option value="gc">оцинкованный</option><option value="polymer">с полимерным покрытием</option></select></label>
      <label class="field"><span class="lab">Класс точности</span>
        <select id="pc"></select></label>
    </div>

    <div class="grid2">
      <label class="field"><span class="lab">Толщина, мм</span>
        <div class="inline"><select id="tSel"></select><button class="icon-btn" id="tMgBtn" title="Добавить / удалить">✎</button></div></label>
      <label class="field"><span class="lab">Ширина подката, мм</span>
        <div class="inline"><select id="wSel"></select><button class="icon-btn" id="wMgBtn" title="Добавить / удалить">✎</button></div></label>
    </div>

    <label class="field"><span class="lab">Кромка подката (неразрезанный рулон)</span>
      <select id="edge"><option value="необрезная">необрезная</option><option value="обрезная">обрезная</option></select></label>
    <button class="primary" id="calc">Показать допуски</button>
  </div></div>

  <div id="out"></div>
  <div id="defref"></div>
  <footer>Значения из транскрипции ВТИ УМК-82-10-2023 / ГОСТ; при ответственной резке сверяйтесь с оригиналом НД.</footer>
</div>

<div id="modal" class="modal" style="display:none">
  <div class="modal-bg" id="modalBg"></div>
  <div class="modal-panel"><button class="modal-x" id="modalX">✕</button><div id="modalBody"></div></div>
</div>

<script>
"use strict";
/* ===== справочник НД ===== */
const ND = {
  "ТУ 14-1-3579-83":{mat:"gk",desc:"г/к рулонный, трубный"},
  "ТУ 14-1-2660-79":{mat:"gk",desc:"г/к для сварных труб"},
  "ТУ 14-1-4516-88":{mat:"gk",desc:"г/к подкат (полоса)"},
  "ГОСТ 19903-2015":{mat:"gk",desc:"прокат г/к, сортамент"},
  "ГОСТ 19904-90":{mat:"xk",desc:"прокат х/к, сортамент"},
  "ГОСТ 14918-2020":{mat:"gc",desc:"горячеоцинкованный"},
  "ГОСТ 16523-97":{mat:"gk",desc:"тонколистовой угл."},
  "ГОСТ 9045-93":{mat:"xk",desc:"х/к низкоуглерод."},
  "ГОСТ 17066-94":{mat:"gk",desc:"повыш. прочности"},
  "ГОСТ 19281-2014":{mat:"gk",desc:"повыш. прочности"},
  "ГОСТ 34180-2017":{mat:"polymer",desc:"с полим. покрытием"},
  "ГОСТ 503-81":{mat:"xk",desc:"лента х/к"},
  "ГОСТ 19851-74":{mat:"xk",desc:"лента резаная х/к"},
  "ГОСТ 6009-74":{mat:"gk",desc:"лента г/к"},
  "СТО ММК 401-2020":{mat:"gc",desc:"г/ц (ММК)"},
  "ТС 14-101-928-2017":{mat:"gc",desc:"г/ц и ПК, минус. допуск"}
};
const ND_DEFAULT="ТУ 14-1-3579-83";

/* ===== толщина: разбор допуска в {plus,minus,str} ===== */
function inThk(x,r){return x>r.f && x<=r.t}
function thk(f,t){return{f:f,t:t}}
function parseTol(raw){
  if(raw==null) return null;
  if(raw.indexOf("/")>=0){ const p=raw.split("/"); return {plus:Math.abs(parseFloat(p[0])),minus:Math.abs(parseFloat(p[1]))}; }
  const x=parseFloat(raw); return {plus:x,minus:x};
}
function mm(x){ if(x==null||isNaN(x))return"—"; return (Math.round(x*1000)/1000).toString().replace(".",",")+" мм"; }
function tolStr(tol){ if(!tol)return null; if(Math.abs(tol.plus-tol.minus)<1e-9) return "±"+mm(tol.plus); return "+"+mm(tol.plus)+" / −"+mm(tol.minus); }

const TH_GK={ bands:[{f:500,t:750},{f:750,t:1000},{f:1000,t:1500},{f:1500,t:2000}],
  rows:[
    [thk(0.75,0.90),[".08",".10",".08",".10",null,null,null,null]],
    [thk(0.90,1.10),[".09",".11",".09",".12",null,null,null,null]],
    [thk(1.10,1.20),[".10",".12",".11",".13",".12",".15",null,null]],
    [thk(1.20,1.30),[".11",".13",".12",".14",".12",".15",null,null]],
    [thk(1.30,1.40),[".11",".14",".12",".15",".12",".18",null,null]],
    [thk(1.40,1.60),[".12",".15",".13",".15",".13",".18",null,null]],
    [thk(1.60,1.80),[".13",".15",".14",".17",".14",".18",null,null]],
    [thk(1.80,2.00),[".14",".16",".15",".17",".16",".18",".17",".20"]],
    [thk(2.00,2.20),[".15",".17",".16",".18",".17",".19",".18",".20"]],
    [thk(2.20,2.50),[".16",".18",".17",".19",".18",".20",".19",".21"]],
    [thk(2.50,3.00),[".17",".19",".18",".20",".19",".21",".20",".22"]],
    [thk(3.00,3.50),[".18",".20",".19",".21",".20",".22",".22",".24"]],
    [thk(3.50,3.90),[".20",".22",".21",".23",".22",".24",".24",".26"]],
    [thk(3.90,5.50),["+.10/-.40","+.20/-.40","+.15/-.40","+.30/-.40","+.10/-.50","+.30/-.50","+.20/-.50","+.40/-.50"]],
    [thk(5.50,7.50),["+.00/-.50","+.10/-.50","+.10/-.60","+.20/-.60","+.10/-.60","+.25/-.60","+.20/-.60","+.40/-.60"]]
  ]};
const TH_XK={ bands:[{f:0,t:1000},{f:1000,t:1500},{f:1500,t:2000}],
  rows:[
    [thk(0.65,0.90),[".04",".06",".08",".05",".06",".08",".07",".09",".11"]],
    [thk(0.90,1.20),[".05",".08",".10",".06",".09",".11",".07",".10",".13"]],
    [thk(1.20,1.40),[".06",".09",".10",".07",".10",".12",".08",".12",".15"]],
    [thk(1.40,1.50),[".07",".10",".12",".08",".11",".13",".09",".13",".16"]],
    [thk(1.50,1.80),[".08",".12",".14",".09",".12",".15",".10",".14",".17"]],
    [thk(1.80,2.00),[".08",".12",".15",".09",".13",".16",".10",".15",".18"]],
    [thk(2.00,2.50),[".10",".14",".17",".11",".15",".18",".12",".18",".20"]],
    [thk(2.50,3.00),[".12",".16",".18",".13",".16",".19",".14",".19",".22"]],
    [thk(3.00,3.20),[".13",".17",".19",".14",".18",".21",".18",".20",".23"]],
    [thk(3.20,4.00),[".14",".18",".20",".16",".19",".22",".19",".21",".24"]]
  ]};
function thicknessTol(mat,t,w,pc){
  if(mat==="xk"||mat==="gc"||mat==="polymer"){
    let row=null; for(const r of TH_XK.rows){if(inThk(t,r[0])){row=r[1];break}}
    if(!row) return {note:"толщина вне табл.11 — сверьте оригинал"};
    let bi=-1; TH_XK.bands.forEach((b,i)=>{ if((b.f===0&&w<=b.t)||(w>b.f&&w<=b.t)) bi=i; });
    if(bi<0) return {note:"ширина вне табл.11 (>2000 мм)"};
    const P={"высокая":0,"повышенная":1,"нормальная":2};
    return {tol:parseTol(row[bi*3+P[pc]]),src:"ГОСТ 19904, табл.11"};
  }
  let row=null; for(const r of TH_GK.rows){if(inThk(t,r[0])){row=r[1];break}}
  if(!row) return {note:"толщина вне табл.5 — сверьте оригинал"};
  let bi=-1; TH_GK.bands.forEach((b,i)=>{ if(w>b.f&&w<=b.t) bi=i; });
  if(bi<0) return {note: w<=500?"ширина < 500 мм — вне табл.5, сверьте оригинал":"ширина > 2000 мм — вне табл.5"};
  const col = pc==="нормальная"?1:0;
  const val=row[bi*2+col];
  if(val==null) return {note:"для этой ширины/толщины в табл.5 значения нет (—)"};
  return {tol:parseTol(val),src:"ГОСТ 19903, табл.5"};
}

/* ===== ширина / телескопичность / серповидность ===== */
function width_gk(w,edge){ return edge==="обрезная"? (w<=1000?"+5":"+10") : (w<=1000?"+20":"+30"); }
function width_xk(w,edge,pc){ if(edge==="необрезная")return"+20"; const P={"высокая":0,"повышенная":1,"нормальная":2};
  const rows=[{t:1000,v:["+2","+2","+5"]},{t:1500,v:["+3","+5","+10"]},{t:1e9,v:["+3","+7","+10"]}];
  for(const r of rows){if(w<=r.t)return r.v[P[pc]]} return null; }
function width_shtrips(w,pc){ const norm=pc==="нормальная"; if(w<=250)return norm?"+1":"+0,6"; if(w<=500)return norm?"+1,5":"+1"; if(w<=1200)return norm?"+7":"+4"; return norm?"+10":"+6"; }
function tele_gk(t,w){ if(t<=2.5)return w<=800?"≤ 50 мм":"≤ 100 мм (по согл. 70)"; return w<=800?"≤ 35 мм":"≤ 70 мм"; }
function tele_xk(t,w){ if(t<=2.5)return w<=1000?"≤ 40 мм":"≤ 60 мм"; return w<=1000?"≤ 30 мм":"≤ 50 мм"; }
function serp503(w){ if(w<=15)return{a:4,b:2}; if(w<=25)return{a:3,b:2}; if(w<=40)return{a:3,b:1.5}; if(w<=50)return{a:2.5,b:1.25}; if(w<=125)return{a:2,b:1.25}; return{a:2,b:1}; }
function waviness(w){ if(w<=50)return"≤ 3 мм на 1 м"; if(w<=200)return"≤ 5 мм на 1 м"; return"≤ 10 мм на 1 м"; }

/* ===== «чего быть не должно» ===== */
const NOT_PODKAT_COMMON=[
  "Заворот (загиб) кромки рулона под углом 90° и более — допускается лишь изгиб кромки на 2–3 витках под углом менее 90° (п.6.1.18)",
  "Неплотная смотка рулона — неплотно прилегать может не более двух наружных витков (п.5.1.3)"
];
const NOT_PODKAT={
  gk:[
    "Плёны, порезы, пузыри, закаты, трещины, вкатанная окалина, вкатанные металлические и инородные частицы, сквозные разрывы, перетравы, недотравы",
    "Расслоения",
    "Дефекты глубже 1/2 суммы предельных отклонений по толщине и выводящие прокат за минимальный размер по толщине",
    "Серповидность более 10 мм на 3 м длины (п.5.2.4)",
    "На необрезной кромке — надрывы и дефекты глубже 1/2 предельного отклонения по ширине (п.5.2.3)"
  ],
  xk:[
    "Плёны, сквозные разрывы, пузыри-вздутия, раскатанные пузыри, пятна слипания-сварки, порезы, надрывы, вкатанная окалина, полосы нагартовки, вкатанные частицы",
    "Расслоение",
    "Дефекты глубже 1/2 суммы предельных отклонений по толщине; цвета побежалости далее 50 мм от кромок; риски/царапины на лицевой стороне длиннее 50 мм",
    "Отдельные выступающие витки и нарушение внутреннего диаметра рулона («птичка») — п.5.3.1",
    "Рванины, вмятины и дефекты на кромках, выводящие ширину за пределы допуска (п.5.3.5)"
  ],
  gc:[

const GSTEMS=Object.keys(GLOSSARY).sort((a,b)=>b.length-a.length);
const GRE=new RegExp("("+GSTEMS.map(s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")[а-яё]*","gi");

/* ===== рендер ===== */
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function linkify(text){
  return esc(text).replace(GRE,(m)=>{ const low=m.toLowerCase(); const stem=GSTEMS.find(s=>low.indexOf(s)===0); return stem?`<span class="term" data-t="${stem}">${m}</span>`:m; });
}
function row(k,v,src){ return `<div class="row"><div class="k">${esc(k)}</div><div class="v">${v==null?'<span class="muted">нет в базе — сверьте оригинал</span>':esc(v)}${src?`<small>${esc(src)}</small>`:''}</div></div>`; }

/* ===== модальное окно ===== */
function openModal(html){ document.getElementById("modalBody").innerHTML=html; document.getElementById("modal").style.display="flex"; }
function closeModal(){ document.getElementById("modal").style.display="none"; }
function showTerm(stem){ const g=GLOSSARY[stem]; if(g) openModal(`<h3>${esc(g.t)}</h3><p>${esc(g.d)}</p>`); }
function manageList(key,base,selId,title){
  const arr=getList(key,base);
  let h=`<h3>${esc(title)}</h3>`;
  h+= arr.length? arr.map(v=>`<div class="mrow"><span class="mv">${String(v).replace(".",",")}</span><button data-del="${v}">Удалить</button></div>`).join("") : `<p>Список пуст. Добавь значение кнопкой ＋.</p>`;
  h+=`<div class="mrow" style="border-top:1px solid var(--border)"><input id="mgAdd" type="number" step="0.01" inputmode="decimal" placeholder="добавить значение" style="flex:1"><button data-addkey style="border-color:var(--accent);background:var(--accent);color:var(--accent-ink)">＋</button></div>`;
  openModal(h);
  const body=document.getElementById("modalBody");
  body.querySelectorAll("button[data-del]").forEach(b=>b.addEventListener("click",()=>{ const v=parseFloat(b.getAttribute("data-del")); const a=getList(key,base).filter(x=>x!==v); localStorage.setItem(key,JSON.stringify(a)); fillSelect(selId,getList(key,base)); manageList(key,base,selId,title); }));
  const addBtn=body.querySelector("button[data-addkey]");
  if(addBtn) addBtn.addEventListener("click",()=>{ const v=parseFloat((document.getElementById("mgAdd").value||"").replace(",",".")); if(!(v>0))return; const a=getList(key,base); if(a.indexOf(v)<0)a.push(v); localStorage.setItem(key,JSON.stringify(a)); fillSelect(selId,getList(key,base)); manageList(key,base,selId,title); });
}

function compute(){
  const sel=document.getElementById("ndSel").value;
  const ndText = sel==="__custom__" ? ((document.getElementById("ndCustom").value||"").trim()||"свой НД") : (sel||"НД не указан");
  const mat=document.getElementById("mat").value;
  const pc=document.getElementById("pc").value;
  const t=parseFloat(document.getElementById("tSel").value), w=parseFloat(document.getElementById("wSel").value);
  const edge=document.getElementById("edge").value;
  const out=document.getElementById("out");
  if(!(t>0)||!(w>0)){ out.innerHTML=`<div class="card"><div class="banner warn">⚠ Укажите толщину и ширину подката.</div></div>`; return; }

  const th=thicknessTol(mat,t,w,pc);
  const thStr = th.tol? tolStr(th.tol) : null;
  const thSrc = th.tol? th.src : (th.note||"—");
  const burr = th.tol? "≤ "+mm(Math.max(th.tol.plus,th.tol.minus)) : null;
  const raznotol = th.tol? "≤ "+mm((th.tol.plus+th.tol.minus)/2) : null;

  let html="";
  /* ПОДКАТ */
  html+=`<div class="card">`;
  html+=`<div class="sect-hd">📦 Подкат (входной рулон) <small>${esc(ndText)}</small></div>`;
  html+=row("Толщина", thStr, thSrc);
  html+=row("Ширина", (mat==="xk"?width_xk(w,edge,pc):width_gk(w,edge))+" мм", (mat==="xk"?"ГОСТ 19904, табл.10":"ГОСТ 19903, табл.4")+", кромка: "+edge);
  html+=row("Телескопичность", mat==="xk"?tele_xk(t,w):tele_gk(t,w), mat==="xk"?"ГОСТ 19904":"ГОСТ 19903, табл.6");
  html+=`<div class="sub-hd">Чего быть не должно на подкате</div>`;
  html+=`<ul class="notlist">${(NOT_PODKAT[mat]||[]).concat(NOT_PODKAT_COMMON).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
  html+=`</div>`;

  /* ПОЛОСЫ */
  html+=`<div class="card">`;
  html+=`<div class="sect-hd">✂️ Полосы после резки (штрипс)</div>`;
  html+=row("Толщина полосы", thStr, "= допуск подката по толщине");
  html+=row("Разнотолщинность в одном сечении", raznotol, "1/2 суммы предельных отклонений по толщине (ВТИ п.6.1.13)");
  html+=row("Заусенец по кромке", burr, "≤ предельного отклонения по толщине (ВТИ п.6.1.17)");
  html+=row("Серповидность", "≤ 3 мм на 1 м", "общее требование (ВТИ п.6.1.19); с контролем по классам А/Б — по ГОСТ 503, табл.22");
  html+=row("Плоскостность", "≤ 10 мм", "если не оговорено в заказе (ВТИ п.6.1.16)");
  html+=row("Волнистость на 1 м", "≤3 мм (шир. ≤50) · ≤5 мм (50–200) · ≤10 мм (>200)", "ВТИ п.6.2.13");
  html+=row("Телескопичность", "≤ 5 мм", "ВТИ п.6.1.4");
  html+=`<div class="sub-hd">Чего быть не должно на полосах</div>`;
  html+=`<ul class="notlist">${NOT_STRIP.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
  html+=`</div>`;

  out.innerHTML=html;
  out.scrollIntoView({behavior:"smooth",block:"start"});
}

/* ===== списки толщины/ширины с сохранением ===== */
// список хранится целиком в localStorage: базовые значения — лишь начальный посев,
// дальше пользователь полностью управляет (добавить/удалить любое).
function getList(key,base){ let v=null; try{v=JSON.parse(localStorage.getItem(key))}catch(e){} if(!Array.isArray(v)){ v=base.slice(); localStorage.setItem(key,JSON.stringify(v)); } return v.filter(x=>x>0).sort((a,b)=>a-b); }
function fillSelect(selId,arr){ const s=document.getElementById(selId); const cur=s.value; s.innerHTML=""; arr.forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=String(v).replace(".",",");s.appendChild(o)}); if(arr.map(String).indexOf(cur)>=0)s.value=cur; }
function addTo(key,base,selId,addId){ const v=parseFloat((document.getElementById(addId).value||"").replace(",",".")); if(!(v>0))return; const arr=getList(key,base); if(arr.indexOf(v)<0)arr.push(v); localStorage.setItem(key,JSON.stringify(arr)); fillSelect(selId,getList(key,base)); document.getElementById(selId).value=v; document.getElementById(addId).value=""; }
function delFrom(key,base,selId){ const s=document.getElementById(selId); const v=parseFloat(s.value); if(!(v>0))return; const arr=getList(key,base).filter(x=>x!==v); localStorage.setItem(key,JSON.stringify(arr)); fillSelect(selId,getList(key,base)); }

/* классы точности с буквами */
function pcOptions(mat){ return mat==="gk" ? [{v:"повышенная",l:"Повышенная (А)"},{v:"нормальная",l:"Нормальная (Б)"}] : [{v:"высокая",l:"Высокая (А)"},{v:"повышенная",l:"Повышенная (Б)"},{v:"нормальная",l:"Нормальная (В)"}]; }
function rebuildPc(){ const mat=document.getElementById("mat").value, pc=document.getElementById("pc"); const cur=pc.value; pc.innerHTML=""; const opts=pcOptions(mat); opts.forEach(o=>{const e=document.createElement("option");e.value=o.v;e.textContent=o.l;pc.appendChild(e)}); if(opts.some(o=>o.v===cur))pc.value=cur; else pc.value="повышенная"; }

function renderDefRef(){
  const items=DEFECTS.map(d=>{
    const ph=DEFECT_PHOTOS[d.n];
    const photo = ph ? `<img src="${ph}" alt="${esc(d.n)}" loading="lazy">` : `<div class="nophoto">Фото пока нет</div>`;
    return `<details class="defitem"><summary>${esc(d.n)}</summary><div class="defbody"><p>${esc(d.d)}</p>${photo}</div></details>`;
  }).join("");
  document.getElementById("defref").innerHTML=
    `<div class="card"><details class="defref"><summary>📖 Справочник дефектов <small>нажми, чтобы открыть</small></summary>`+
    `<div>${items}</div></details></div>`;
}

/* ===== init ===== */
const T_BASE=[1.3,1.8,2.7], W_BASE=[1000,1250,1500];
(function(){
  const ndSel=document.getElementById("ndSel"), matSel=document.getElementById("mat");
  const ndCustom=document.getElementById("ndCustom"), ndCustomWrap=document.getElementById("ndCustomWrap");
  const ph=document.createElement("option"); ph.value=""; ph.textContent="— выбери НД —"; ndSel.appendChild(ph);
  Object.keys(ND).forEach(k=>{const o=document.createElement("option");o.value=k;o.textContent=k+" — "+ND[k].desc;ndSel.appendChild(o)});
  const cu=document.createElement("option"); cu.value="__custom__"; cu.textContent="✏️ Другой — вписать свой"; ndSel.appendChild(cu);
  ndSel.addEventListener("change",()=>{ if(ndSel.value==="__custom__"){ndCustomWrap.style.display="block";ndCustom.focus();} else {ndCustomWrap.style.display="none"; if(ND[ndSel.value]){matSel.value=ND[ndSel.value].mat;rebuildPc();}} });
  matSel.addEventListener("change",rebuildPc);
  // НД по умолчанию
  ndSel.value=ND_DEFAULT; if(ND[ND_DEFAULT]) matSel.value=ND[ND_DEFAULT].mat;
  rebuildPc();

  fillSelect("tSel",getList("md.thk",T_BASE));
  fillSelect("wSel",getList("md.wid",W_BASE));
  document.getElementById("tMgBtn").addEventListener("click",()=>manageList("md.thk",T_BASE,"tSel","Толщины, мм"));
  document.getElementById("wMgBtn").addEventListener("click",()=>manageList("md.wid",W_BASE,"wSel","Ширины подката, мм"));
  // закрытие модального окна (используется для ✎ списков)
  document.getElementById("modalX").addEventListener("click",closeModal);
  document.getElementById("modalBg").addEventListener("click",closeModal);

  renderDefRef();

  try{ if(localStorage.getItem("md.dark")==="1")document.getElementById("themeToggle").checked=true; }catch(e){}
  document.getElementById("themeToggle").addEventListener("change",e=>{try{localStorage.setItem("md.dark",e.target.checked?"1":"0")}catch(e){}});
  document.getElementById("calc").addEventListener("click",compute);
})();
</script>
